<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進数変換 | ツール集</title>
    <style>
        :root {
            --indigo: #4f46e5;
            --violet: #7c3aed;
            --emerald: #059669;
            --bg: #f5f6ff;
            --surf: #fff;
            --border: #e0e7ff;
            --text: #1e1b4b;
            --text2: #4c4980;
            --muted: #8b87c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: #fff;
            padding: 24px 20px;
            margin-bottom: 32px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        header a {
            color: #a5b4fc;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-top: 8px;
        }

        header a:hover {
            color: #fff;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .card {
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(79, 70, 229, 0.06);
            margin-bottom: 20px;
        }

        .base-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        .base-input-group {
            display: flex;
            flex-direction: column;
        }

        .base-input-group label {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-family: "Monaco", "Courier New", monospace;
            font-size: 14px;
            color: var(--text);
            background: #fafbff;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--indigo);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        input[type="text"].error {
            border-color: #dc2626;
        }

        input[type="text"].error:focus {
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .copy-btn {
            padding: 8px 12px;
            background: var(--border);
            color: var(--text);
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: #d5dce5;
        }

        .copy-btn.copied {
            background: var(--emerald);
            color: #fff;
        }

        .error-message {
            color: #dc2626;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--indigo), var(--violet));
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #d5dce5;
        }

        footer {
            background: var(--surf);
            border-top: 1px solid var(--border);
            padding: 24px 20px;
            margin-top: 48px;
            text-align: center;
            color: var(--text2);
            font-size: 13px;
        }

        footer a {
            color: var(--indigo);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 860px) {
            .base-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .input-wrapper {
                flex-direction: column;
                align-items: stretch;
            }

            .copy-btn {
                width: 100%;
            }

            header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>進数変換</h1>
        <a href="../">← ツール一覧へ戻る</a>
    </header>

    <div class="container">
        <div class="card">
            <div class="base-grid">
                <div class="base-input-group">
                    <label for="binary">2進数</label>
                    <div class="input-wrapper">
                        <input type="text" id="binary" placeholder="0, 1" oninput="handleInput('binary')">
                        <button class="copy-btn" onclick="copyValue('binary')">コピー</button>
                    </div>
                    <div class="error-message" id="binaryError"></div>
                </div>

                <div class="base-input-group">
                    <label for="octal">8進数</label>
                    <div class="input-wrapper">
                        <input type="text" id="octal" placeholder="0-7" oninput="handleInput('octal')">
                        <button class="copy-btn" onclick="copyValue('octal')">コピー</button>
                    </div>
                    <div class="error-message" id="octalError"></div>
                </div>

                <div class="base-input-group">
                    <label for="decimal">10進数</label>
                    <div class="input-wrapper">
                        <input type="text" id="decimal" placeholder="0-9" oninput="handleInput('decimal')">
                        <button class="copy-btn" onclick="copyValue('decimal')">コピー</button>
                    </div>
                    <div class="error-message" id="decimalError"></div>
                </div>

                <div class="base-input-group">
                    <label for="hexadecimal">16進数</label>
                    <div class="input-wrapper">
                        <input type="text" id="hexadecimal" placeholder="0-9, A-F" oninput="handleInput('hexadecimal')">
                        <button class="copy-btn" onclick="copyValue('hexadecimal')">コピー</button>
                    </div>
                    <div class="error-message" id="hexadecimalError"></div>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-secondary" onclick="clearAll()">クリア</button>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 とある制御屋のツール集</p>
        <p><a href="../">ツール一覧へ</a> | <a href="https://toaruseigyoya.github.io/">ホームサイト</a></p>
    </footer>

    <script>
        const baseConfigs = {
            binary: { base: 2, validChars: /^[01]*$/, errorMsg: '0 と 1 のみ使用できます' },
            octal: { base: 8, validChars: /^[0-7]*$/, errorMsg: '0-7 のみ使用できます' },
            decimal: { base: 10, validChars: /^[0-9]*$/, errorMsg: '0-9 のみ使用できます' },
            hexadecimal: { base: 16, validChars: /^[0-9a-fA-F]*$/, errorMsg: '0-9, A-F のみ使用できます' }
        };

        function handleInput(baseType) {
            const input = document.getElementById(baseType);
            const value = input.value.trim();
            const config = baseConfigs[baseType];
            const errorEl = document.getElementById(baseType + 'Error');

            // Clear error message
            errorEl.textContent = '';
            errorEl.classList.remove('show');
            input.classList.remove('error');

            if (value === '') {
                clearAllInputs();
                return;
            }

            // Validate input
            if (!config.validChars.test(value)) {
                errorEl.textContent = config.errorMsg;
                errorEl.classList.add('show');
                input.classList.add('error');
                return;
            }

            // Convert to decimal first
            let decimal;
            try {
                decimal = parseInt(value, config.base);
                if (isNaN(decimal)) {
                    throw new Error('Invalid number');
                }
            } catch (e) {
                errorEl.textContent = 'エラーが発生しました';
                errorEl.classList.add('show');
                input.classList.add('error');
                return;
            }

            // Update all other inputs
            updateAllBases(decimal);
        }

        function updateAllBases(decimal) {
            document.getElementById('binary').value = decimal.toString(2);
            document.getElementById('octal').value = decimal.toString(8);
            document.getElementById('decimal').value = decimal.toString(10);
            document.getElementById('hexadecimal').value = decimal.toString(16).toUpperCase();

            // Clear all error messages
            Object.keys(baseConfigs).forEach(base => {
                document.getElementById(base + 'Error').classList.remove('show');
                document.getElementById(base).classList.remove('error');
            });
        }

        function clearAllInputs() {
            Object.keys(baseConfigs).forEach(base => {
                document.getElementById(base).value = '';
                document.getElementById(base).classList.remove('error');
                document.getElementById(base + 'Error').classList.remove('show');
            });
        }

        function clearAll() {
            clearAllInputs();
            document.getElementById('binary').focus();
        }

        function copyValue(baseType) {
            const input = document.getElementById(baseType);
            if (!input.value) return;

            input.select();
            document.execCommand('copy');

            const btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = 'コピーしました！';
            btn.classList.add('copied');

            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.remove('copied');
            }, 2000);
        }
    </script>
</body>
</html>
