<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>色辞典 | 公開ツール一覧</title><style>
body{font-family:'Segoe UI','Yu Gothic UI',sans-serif;background:#f6f8fc;color:#1f2937;margin:0}header,main{max-width:1060px;margin:auto;padding:20px}.back{color:#2563eb;text-decoration:none;font-weight:800}.lead{color:#667085}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid #d9e3f0;background:#fff;border-radius:999px;padding:8px 12px;font-weight:900;cursor:pointer}.tab.active{background:#3b82f6;color:#fff}.search{width:100%;border:1px solid #d9e3f0;border-radius:12px;padding:12px;font:inherit;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}.sw{background:#fff;border:1px solid #d9e3f0;border-radius:12px;overflow:hidden}.color{height:72px}.meta{padding:10px}.name{font-weight:900}.code{font-family:Consolas,monospace;color:#667085}</style></head><body><header><a class="back" href="../">← 公開ツール一覧へ</a><h1>色辞典</h1><p class="lead">色名とカラーコードを一覧で確認できます。原色、和色、パステル、モノトーンなどを切り替えできます。</p></header><main><div class="tabs" id="tabs"></div><input class="search" id="q" placeholder="色名・カラーコードで検索"><div class="grid" id="grid"></div></main><script>
const sets={
 '原色':[['black','#000000'],['white','#ffffff'],['red','#ff0000'],['blue','#0000ff'],['green','#008000'],['yellow','#ffff00'],['cyan','#00ffff'],['magenta','#ff00ff'],['orange','#ffa500'],['purple','#800080'],['navy','#000080'],['teal','#008080'],['gray','#808080'],['silver','#c0c0c0'],['coral','#ff7f50'],['tomato','#ff6347'],['gold','#ffd700'],['hotpink','#ff69b4']],
 '和色':[['桜色','#fef4f4'],['紅梅色','#f2a0a1'],['茜色','#b7282e'],['山吹色','#f8b500'],['若草色','#c3d825'],['萌葱色','#006e54'],['浅葱色','#00a3af'],['藍色','#165e83'],['藤色','#bbbcde'],['墨色','#343434'],['生成り色','#fbfaf5'],['栗色','#762f07']],
 'パステル':[['pastel pink','#ffd1dc'],['pastel blue','#aec6cf'],['pastel green','#bdecb6'],['pastel yellow','#fff9b1'],['pastel purple','#cdb4db'],['pastel orange','#ffd8a8'],['mint','#b8f2e6'],['lavender','#e6e6fa']],
 'モノトーン':[['white','#ffffff'],['snow','#fffafa'],['whitesmoke','#f5f5f5'],['gainsboro','#dcdcdc'],['lightgray','#d3d3d3'],['darkgray','#a9a9a9'],['gray','#808080'],['dimgray','#696969'],['black','#000000']]
};let current='原色';const tabs=document.getElementById('tabs'),grid=document.getElementById('grid'),q=document.getElementById('q');Object.keys(sets).forEach(k=>{const b=document.createElement('button');b.className='tab';b.textContent=k;b.onclick=()=>{current=k;render()};tabs.appendChild(b)});function render(){[...tabs.children].forEach(b=>b.classList.toggle('active',b.textContent===current));const query=q.value.toLowerCase();grid.innerHTML='';sets[current].filter(([n,c])=>(n+c).toLowerCase().includes(query)).forEach(([n,c])=>{const d=document.createElement('button');d.className='sw';d.innerHTML=`<div class="color" style="background:${c}"></div><div class="meta"><div class="name">${n}</div><div class="code">${c}</div></div>`;d.onclick=()=>navigator.clipboard.writeText(c);grid.appendChild(d)})}q.oninput=render;render();
</script></body></html>
