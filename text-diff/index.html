<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テキスト差分比較 | ツール集</title>
    <style>
        :root {
            --indigo: #4f46e5;
            --violet: #7c3aed;
            --emerald: #059669;
            --bg: #f5f6ff;
            --surf: #fff;
            --border: #e0e7ff;
            --text: #1e1b4b;
            --text2: #4c4980;
            --muted: #8b87c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: #fff;
            padding: 24px 20px;
            margin-bottom: 32px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 12px;
        }

        header a {
            color: #a5b4fc;
            text-decoration: none;
            font-size: 14px;
            display: inline-block;
            margin-top: 8px;
        }

        header a:hover {
            color: #fff;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .card {
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(79, 70, 229, 0.06);
            margin-bottom: 20px;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group textarea {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: "Monaco", "Courier New", monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 300px;
            color: var(--text);
            background: #fafbff;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: var(--indigo);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--indigo), var(--violet));
            color: #fff;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #d5dce5;
        }

        .summary-section {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .summary-item {
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            background: #fafbff;
        }

        .summary-item.added {
            border-left: 4px solid var(--emerald);
        }

        .summary-item.removed {
            border-left: 4px solid #dc2626;
        }

        .summary-item.unchanged {
            border-left: 4px solid #9ca3af;
        }

        .summary-item .number {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }

        .summary-item .label {
            font-size: 12px;
            color: var(--text2);
            margin-top: 4px;
        }

        .diff-result {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 600px;
            overflow-y: auto;
            padding: 12px;
            background: #fafbff;
            border-radius: 8px;
        }

        .diff-line {
            padding: 8px 12px;
            border-radius: 4px;
            font-family: "Monaco", "Courier New", monospace;
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
        }

        .diff-line.added {
            background: #ecfdf5;
            color: #065f46;
            border-left: 3px solid var(--emerald);
        }

        .diff-line.removed {
            background: #fef2f2;
            color: #7f1d1d;
            border-left: 3px solid #dc2626;
        }

        .diff-line.unchanged {
            background: #fff;
            color: var(--text);
            border-left: 3px solid #e5e7eb;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text2);
        }

        .empty-state p {
            font-size: 14px;
        }

        footer {
            background: var(--surf);
            border-top: 1px solid var(--border);
            padding: 24px 20px;
            margin-top: 48px;
            text-align: center;
            color: var(--text2);
            font-size: 13px;
        }

        footer a {
            color: var(--indigo);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 860px) {
            .input-section {
                grid-template-columns: 1fr;
            }

            .summary-section {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 24px;
            }

            .input-group textarea {
                min-height: 200px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>テキスト差分比較</h1>
        <a href="../">← ツール一覧へ戻る</a>
    </header>

    <div class="container">
        <div class="card">
            <div class="input-section">
                <div class="input-group">
                    <label for="textA">入力A</label>
                    <textarea id="textA" placeholder="比較するテキストを入力してください"></textarea>
                </div>
                <div class="input-group">
                    <label for="textB">入力B</label>
                    <textarea id="textB" placeholder="比較するテキストを入力してください"></textarea>
                </div>
            </div>

            <div class="button-group">
                <button class="btn-primary" onclick="compareDiff()">比較する</button>
                <button class="btn-secondary" onclick="clearAll()">クリア</button>
            </div>

            <div id="summarySection" style="display: none;">
                <div class="summary-section">
                    <div class="summary-item added">
                        <div class="number" id="countAdded">0</div>
                        <div class="label">追加行</div>
                    </div>
                    <div class="summary-item removed">
                        <div class="number" id="countRemoved">0</div>
                        <div class="label">削除行</div>
                    </div>
                    <div class="summary-item unchanged">
                        <div class="number" id="countUnchanged">0</div>
                        <div class="label">変更なし</div>
                    </div>
                </div>
            </div>

            <div id="resultContainer">
                <div class="empty-state">
                    <p>入力Aと入力Bのテキストを入力して「比較する」をクリックしてください</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 とある制御屋のツール集</p>
        <p><a href="../">ツール一覧へ</a> | <a href="https://toaruseigyoya.github.io/">ホームサイト</a></p>
    </footer>

    <script>
        function computeDiff(linesA, linesB) {
            const m = linesA.length;
            const n = linesB.length;

            // LCS (Longest Common Subsequence) 計算
            const dp = Array(m + 1).fill(null).map(() => Array(n + 1).fill(0));

            for (let i = 1; i <= m; i++) {
                for (let j = 1; j <= n; j++) {
                    if (linesA[i - 1] === linesB[j - 1]) {
                        dp[i][j] = dp[i - 1][j - 1] + 1;
                    } else {
                        dp[i][j] = Math.max(dp[i - 1][j], dp[i][j - 1]);
                    }
                }
            }

            // Backtrack to get actual diff
            const result = [];
            let i = m, j = n;

            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && linesA[i - 1] === linesB[j - 1]) {
                    result.unshift({ type: 'unchanged', text: linesA[i - 1] });
                    i--;
                    j--;
                } else if (j > 0 && (i === 0 || dp[i][j - 1] >= dp[i - 1][j])) {
                    result.unshift({ type: 'added', text: linesB[j - 1] });
                    j--;
                } else if (i > 0) {
                    result.unshift({ type: 'removed', text: linesA[i - 1] });
                    i--;
                }
            }

            return result;
        }

        function compareDiff() {
            const textA = document.getElementById('textA').value;
            const textB = document.getElementById('textB').value;

            if (!textA && !textB) {
                alert('テキストを入力してください');
                return;
            }

            const linesA = textA.split('\n');
            const linesB = textB.split('\n');
            const diff = computeDiff(linesA, linesB);

            let countAdded = 0;
            let countRemoved = 0;
            let countUnchanged = 0;

            let resultHtml = '<div class="diff-result">';

            for (const item of diff) {
                if (item.type === 'added') {
                    countAdded++;
                    resultHtml += `<div class="diff-line added">+ ${escapeHtml(item.text)}</div>`;
                } else if (item.type === 'removed') {
                    countRemoved++;
                    resultHtml += `<div class="diff-line removed">- ${escapeHtml(item.text)}</div>`;
                } else {
                    countUnchanged++;
                    resultHtml += `<div class="diff-line unchanged">  ${escapeHtml(item.text)}</div>`;
                }
            }

            resultHtml += '</div>';

            document.getElementById('countAdded').textContent = countAdded;
            document.getElementById('countRemoved').textContent = countRemoved;
            document.getElementById('countUnchanged').textContent = countUnchanged;
            document.getElementById('summarySection').style.display = 'block';
            document.getElementById('resultContainer').innerHTML = resultHtml;
        }

        function clearAll() {
            document.getElementById('textA').value = '';
            document.getElementById('textB').value = '';
            document.getElementById('summarySection').style.display = 'none';
            document.getElementById('resultContainer').innerHTML = '<div class="empty-state"><p>入力Aと入力Bのテキストを入力して「比較する」をクリックしてください</p></div>';
            document.getElementById('textA').focus();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
