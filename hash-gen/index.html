<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ハッシュ生成 | ツール集</title>
    <style>
        :root {
            --indigo: #4f46e5;
            --violet: #7c3aed;
            --emerald: #059669;
            --bg: #f5f6ff;
            --surf: #fff;
            --border: #e0e7ff;
            --text: #1e1b4b;
            --text2: #4c4980;
            --muted: #8b87c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            color: #fff;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .back-link {
            display: inline-block;
            margin-top: 10px;
            color: #e0e7ff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fff;
        }

        .container {
            max-width: 860px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(79, 70, 229, 0.06);
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            padding: 10px 16px;
            border: none;
            background: none;
            color: var(--text2);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: var(--indigo);
            border-bottom-color: var(--indigo);
        }

        .tab-btn:hover {
            color: var(--indigo);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text);
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-family: monospace;
            resize: vertical;
            min-height: 120px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--indigo);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        input[type="file"] {
            padding: 8px 0;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .result-section {
            background: #fafbff;
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .hash-item {
            background: var(--surf);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .hash-item:last-child {
            margin-bottom: 0;
        }

        .hash-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .hash-value {
            font-family: monospace;
            font-size: 12px;
            color: var(--text);
            word-break: break-all;
            background: #fafbff;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 8px;
            user-select: all;
        }

        .copy-btn {
            padding: 6px 12px;
            background: linear-gradient(135deg, var(--indigo), var(--violet));
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .copy-btn.copied {
            background: var(--emerald);
        }

        .hidden {
            display: none;
        }

        footer {
            background: var(--surf);
            border-top: 1px solid var(--border);
            padding: 20px;
            text-align: center;
            color: var(--text2);
            font-size: 13px;
            margin-top: 40px;
        }

        footer a {
            color: var(--indigo);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: var(--violet);
        }

        .loading {
            color: var(--text2);
            font-size: 13px;
        }

        @media (max-width: 860px) {
            .container {
                margin: 20px auto;
            }

            header h1 {
                font-size: 22px;
            }

            .tabs {
                gap: 4px;
            }

            .tab-btn {
                padding: 8px 12px;
                font-size: 13px;
            }
        }
        .tool-guide { background:var(--surf,#fff); border:1px solid var(--border,#e0e7ff); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 2px 10px rgba(79,70,229,.06); }
    .tool-guide h2 { font-size:.95rem; color:#3730a3; margin:0 0 10px; }
    .tool-guide-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
    .tool-guide-item { background:var(--bg,#f5f6ff); border:1px solid var(--border,#e0e7ff); border-radius:10px; padding:10px; font-size:.8rem; line-height:1.55; color:var(--text2,#4c4980); }
    .tool-guide-item strong { display:block; color:var(--text,#1e1b4b); font-size:.76rem; margin-bottom:3px; }
    .tool-guide-links { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .tool-guide-links a { color:#4f46e5; background:#eef2ff; border:1px solid #e0e7ff; border-radius:999px; padding:5px 10px; font-size:.76rem; font-weight:800; text-decoration:none; }
  </style>
</head>
<body>
    <header>
        <h1>ハッシュ生成</h1>
        <a class="back-link" href="../">← ツール一覧へ戻る</a>
    </header>

    <div class="container">
    <section class="tool-guide" aria-label="このツールの説明">
      <h2>このツールでできること</h2>
      <div class="tool-guide-grid">
        <div class="tool-guide-item"><strong>用途</strong>ハッシュ生成 をブラウザで処理する無料ツールです。</div>
        <div class="tool-guide-item"><strong>向いている人</strong>日常・業務で素早く確認したい人</div>
        <div class="tool-guide-item"><strong>入力例</strong>数値、テキスト、URL、条件など</div>
        <div class="tool-guide-item"><strong>出力例</strong>コピーしやすい計算結果・変換結果</div>
        <div class="tool-guide-item"><strong>使い方</strong>入力する → 実行する → 結果を確認します。</div>
        <div class="tool-guide-item"><strong>注意点</strong>入力内容はブラウザ内で処理します。必要に応じて結果をコピーしてください。</div>
      </div>
      <div class="tool-guide-links"><a href="../char-count/">char-count</a><a href="../csv-tsv/">csv-tsv</a><a href="../json-format/">json-format</a></div>
    </section>
        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('text')">テキスト</button>
                <button class="tab-btn" onclick="switchTab('file')">ファイル</button>
            </div>

            <div id="textTab" class="tab-content active">
                <div class="form-group">
                    <label for="textInput">テキスト入力</label>
                    <textarea id="textInput" placeholder="ハッシュ化するテキストを入力..." oninput="calculateHashText()"></textarea>
                </div>
            </div>

            <div id="fileTab" class="tab-content">
                <div class="form-group">
                    <label for="fileInput">ファイル選択</label>
                    <input type="file" id="fileInput" onchange="calculateHashFile()">
                </div>
                <div id="fileInfo" class="hidden" style="font-size: 13px; color: var(--text2); margin-top: 10px;"></div>
            </div>

            <div id="results" class="result-section hidden">
                <div class="hash-item">
                    <div class="hash-label">SHA-256</div>
                    <div class="hash-value" id="sha256Value">-</div>
                    <button class="copy-btn" onclick="copyHash('sha256Value')">コピー</button>
                </div>

                <div class="hash-item">
                    <div class="hash-label">SHA-1</div>
                    <div class="hash-value" id="sha1Value">-</div>
                    <button class="copy-btn" onclick="copyHash('sha1Value')">コピー</button>
                </div>

                <div class="hash-item">
                    <div class="hash-label">SHA-512</div>
                    <div class="hash-value" id="sha512Value">-</div>
                    <button class="copy-btn" onclick="copyHash('sha512Value')">コピー</button>
                </div>
            </div>

            <div id="loading" class="loading hidden">計算中...</div>
        </div>
    </div>

    <footer>
        <p>© 2026 今日もあいネコ</p>
        <p>
            <a href="../">ツール一覧</a> | <a href="https://toaruseigyoya.github.io/">サイト</a>
        </p>
    </footer>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tab + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        async function hashText(text, algorithm) {
            const encoder = new TextEncoder();
            const data = encoder.encode(text);
            const hashBuffer = await crypto.subtle.digest(algorithm, data);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        async function calculateHashText() {
            const text = document.getElementById('textInput').value;

            if (!text) {
                document.getElementById('results').classList.add('hidden');
                return;
            }

            document.getElementById('loading').classList.remove('hidden');

            try {
                const sha256 = await hashText(text, 'SHA-256');
                const sha1 = await hashText(text, 'SHA-1');
                const sha512 = await hashText(text, 'SHA-512');

                document.getElementById('sha256Value').textContent = sha256;
                document.getElementById('sha1Value').textContent = sha1;
                document.getElementById('sha512Value').textContent = sha512;
                document.getElementById('results').classList.remove('hidden');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function calculateHashFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) {
                document.getElementById('results').classList.add('hidden');
                document.getElementById('fileInfo').classList.add('hidden');
                return;
            }

            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('fileInfo').innerHTML = `ファイル: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
            document.getElementById('fileInfo').classList.remove('hidden');

            try {
                const arrayBuffer = await file.arrayBuffer();
                const sha256 = await hashArrayBuffer(arrayBuffer, 'SHA-256');
                const sha1 = await hashArrayBuffer(arrayBuffer, 'SHA-1');
                const sha512 = await hashArrayBuffer(arrayBuffer, 'SHA-512');

                document.getElementById('sha256Value').textContent = sha256;
                document.getElementById('sha1Value').textContent = sha1;
                document.getElementById('sha512Value').textContent = sha512;
                document.getElementById('results').classList.remove('hidden');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        async function hashArrayBuffer(arrayBuffer, algorithm) {
            const hashBuffer = await crypto.subtle.digest(algorithm, arrayBuffer);
            return Array.from(new Uint8Array(hashBuffer))
                .map(b => b.toString(16).padStart(2, '0'))
                .join('');
        }

        function copyHash(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;

            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = 'コピー済み';
                btn.classList.add('copied');

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            });
        }
    </script>
  <script src="../tool-enhancer.js"></script>
</body>
</html>
