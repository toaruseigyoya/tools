<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>OGP確認 | 汎用ツール集</title><style>
body{font-family:'Segoe UI','Yu Gothic UI',sans-serif;background:#f6f8fc;color:#1f2937;margin:0}header,main{max-width:980px;margin:auto;padding:20px}.back{color:#2563eb;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #d9e3f0;border-radius:14px;padding:18px;margin:14px 0}input,textarea{width:100%;border:1px solid #d9e3f0;border-radius:12px;padding:12px;font:inherit}textarea{min-height:170px;font-family:Consolas,monospace}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:900;background:#3b82f6;color:#fff;margin-top:8px}.preview{border:1px solid #d9e3f0;border-radius:14px;overflow:hidden;background:#fff;max-width:560px}.img{height:240px;background:#eef2ff center/cover no-repeat}.pv{padding:14px}.title{font-weight:900}.desc,.url,.muted{color:#667085}</style></head><body><header><a class="back" href="../">← 汎用ツール集へ</a><h1>OGP確認</h1><p class="muted">URLまたはHTMLから、SNSで表示されるタイトル・説明・画像を確認します。URL取得は外部ページへアクセスします。</p></header><main><section class="card"><label>URL</label><input id="url" placeholder="https://example.com/"><button class="btn" id="fetch">URLから取得</button></section><section class="card"><label>HTMLを貼り付けて確認</label><textarea id="html" placeholder="meta property=&quot;og:title&quot; ..."></textarea><button class="btn" id="parse">HTMLを解析</button></section><section class="card"><h2>プレビュー</h2><div class="preview"><div class="img" id="img"></div><div class="pv"><div class="title" id="title">タイトル</div><div class="desc" id="desc">説明文</div><div class="url" id="site">URL</div></div></div></section></main><script>
const $=id=>document.getElementById(id);function meta(doc,n){return doc.querySelector(`meta[property="${n}"],meta[name="${n}"]`)?.content||''}function show(html,base){const doc=new DOMParser().parseFromString(html,'text/html');const title=meta(doc,'og:title')||doc.querySelector('title')?.textContent||'';const desc=meta(doc,'og:description')||meta(doc,'description')||'';let image=meta(doc,'og:image')||meta(doc,'twitter:image')||'';try{if(image)image=new URL(image,base).href}catch(e){}$('title').textContent=title||'タイトルなし';$('desc').textContent=desc||'説明なし';$('site').textContent=base||meta(doc,'og:url')||'';$('img').style.backgroundImage=image?`url("${image}")`:''} $('parse').onclick=()=>show($('html').value,$('url').value);$('fetch').onclick=async()=>{const u=$('url').value.trim();if(!u)return;try{let r=await fetch(u);let txt=await r.text();show(txt,u)}catch(e){try{let r=await fetch('https://api.allorigins.win/raw?url='+encodeURIComponent(u));let txt=await r.text();show(txt,u)}catch(err){alert('取得できませんでした。HTML貼り付けで確認してください。')}}};
</script></body></html>
