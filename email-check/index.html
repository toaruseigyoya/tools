<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>メールアドレス確認 | 公開ツール一覧</title><style>
body{font-family:'Segoe UI','Yu Gothic UI',sans-serif;background:#f6f8fc;color:#1f2937;margin:0}header,main{max-width:920px;margin:auto;padding:20px}.back{color:#2563eb;text-decoration:none;font-weight:800}.card{background:#fff;border:1px solid #d9e3f0;border-radius:14px;padding:18px;margin:14px 0}textarea{width:100%;min-height:210px;border:1px solid #d9e3f0;border-radius:12px;padding:12px;font:15px/1.7 Consolas,monospace}.row{display:grid;grid-template-columns:1fr 90px 1fr;gap:8px;padding:8px;border-bottom:1px solid #eef2f7}.ok{color:#059669;font-weight:900}.ng{color:#dc2626;font-weight:900}.muted{color:#667085}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:900;background:#3b82f6;color:#fff;margin-top:8px}</style></head><body><header><a class="back" href="../">← 公開ツール一覧へ</a><h1>メールアドレス確認</h1><p class="muted">メールアドレスの形式、重複、ドメイン部分を確認します。実在・受信可否を保証するものではありません。入力内容はブラウザ内で処理します。</p></header><main><section class="card"><textarea id="input" placeholder="1行に1件、または文章ごと貼り付け"></textarea><button class="btn" id="copy">結果をコピー</button></section><section class="card"><h2>確認結果</h2><div class="row"><strong>メールアドレス</strong><strong>判定</strong><strong>メモ</strong></div><div id="out"></div></section></main><script>
const input=document.getElementById('input'),out=document.getElementById('out');function run(){const found=input.value.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi)||[];const seen=new Set();out.innerHTML='';if(!found.length){out.innerHTML='<p class="muted">メールアドレスが見つかりません。</p>';return}found.forEach(a=>{const lower=a.toLowerCase();const valid=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(a)&&!/\.\./.test(a)&&!a.startsWith('.')&&!a.includes('@.');const dup=seen.has(lower);seen.add(lower);const domain=a.split('@')[1]||'';const div=document.createElement('div');div.className='row';div.innerHTML=`<span>${a}</span><span class="${valid&&!dup?'ok':'ng'}">${valid&&!dup?'OK':'確認'}</span><span>${dup?'重複しています':valid?'形式OK / ドメイン: '+domain:'形式を確認してください'}</span>`;out.appendChild(div)})}input.oninput=run;document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(out.innerText);run();
</script></body></html>
