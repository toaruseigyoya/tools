<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSONフォーマッター | ツール集</title>
  <meta name="description" content="JSONの整形・圧縮・バリデーション。構文エラーの詳細表示付き">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --indigo: #4f46e5; --violet: #7c3aed; --emerald: #059669; --red: #dc2626;
      --bg: #f5f6ff; --surf: #fff;
      --border: #e0e7ff; --text: #1e1b4b; --text2: #4c4980; --muted: #8b87c0;
    }
    body { font-family: 'Segoe UI','Yu Gothic UI','Hiragino Sans',sans-serif; background: var(--bg); color: var(--text); }
    header { background: linear-gradient(135deg,#1e1b4b,#312e81); color:#fff; }
    .hdr { max-width:860px; margin:0 auto; padding:18px 24px; }
    .hdr-back { display:inline-flex; align-items:center; gap:5px; font-size:.78rem; color:rgba(255,255,255,.55); text-decoration:none; margin-bottom:8px; transition:color .15s; }
    .hdr-back:hover { color:rgba(255,255,255,.9); }
    .hdr-title { font-size:1.4rem; font-weight:900; margin-bottom:4px; }
    .hdr-sub { font-size:.82rem; color:rgba(255,255,255,.65); }
    main { max-width:860px; margin:0 auto; padding:24px; }
    .card { background:var(--surf); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:0 2px 10px rgba(79,70,229,.06); }
    .card-title { font-size:.88rem; font-weight:800; color:#3730a3; margin-bottom:12px; }
    .btn { padding:9px 18px; border:none; border-radius:9px; font-size:.84rem; font-weight:700; cursor:pointer; font-family:inherit; transition:all .15s; }
    .btn-primary { background:linear-gradient(135deg,var(--indigo),var(--violet)); color:#fff; box-shadow:0 3px 10px rgba(79,70,229,.25); }
    .btn-primary:hover { transform:translateY(-1px); }
    .btn-outline { background:transparent; border:1.5px solid var(--border); color:var(--text2); }
    .btn-outline:hover { border-color:#818cf8; color:var(--indigo); }
    .btn-danger { background:transparent; border:1.5px solid rgba(220,38,38,.2); color:var(--red); }
    .btn-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    input[type=text], input[type=number] { width:100%; padding:9px 12px; border:1.5px solid var(--border); border-radius:9px; font-size:.84rem; font-family:inherit; background:var(--bg); color:var(--text); }
    input:focus { outline:none; border-color:#818cf8; }
    textarea { width:100%; padding:10px 12px; border:1.5px solid var(--border); border-radius:9px; font-size:.84rem; font-family:'Consolas',monospace; background:var(--bg); color:var(--text); resize:vertical; }
    textarea:focus { outline:none; border-color:#818cf8; }
    .form-row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    .form-label { font-size:.78rem; font-weight:700; color:var(--text2); white-space:nowrap; }
    .result-box { background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:12px; font-family:'Consolas',monospace; font-size:.9rem; word-break:break-all; }
    .err { color:var(--red); font-size:.78rem; margin-top:6px; }
    .ok { color:var(--emerald); font-size:.78rem; margin-top:6px; }
    .checkbox-group { display:flex; gap:12px; flex-wrap:wrap; }
    .checkbox-group label { display:flex; align-items:center; gap:5px; font-size:.82rem; cursor:pointer; }
    footer { text-align:center; padding:20px; font-size:.73rem; color:var(--muted); border-top:1px solid var(--border); margin-top:8px; }
    footer a { color:#818cf8; text-decoration:none; }

    /* Tool-specific */
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:620px) { .two-col { grid-template-columns:1fr; } }
    textarea.input-area { min-height:200px; }
    textarea.output-area { min-height:200px; background:#f8f9ff; }
    .status-bar {
      display:flex; align-items:center; justify-content:space-between;
      padding:7px 12px; border-radius:8px; font-size:.77rem; font-weight:700;
      margin-bottom:10px;
    }
    .status-ok { background:#d1fae5; color:#065f46; border:1px solid #a7f3d0; }
    .status-err { background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; }
    .status-idle { background:var(--bg); color:var(--muted); border:1px solid var(--border); }
    .char-count { font-size:.73rem; color:var(--muted); text-align:right; margin-top:5px; }
    .err-detail {
      background:#fff5f5; border:1px solid #fca5a5; border-radius:9px;
      padding:10px 14px; font-size:.78rem; color:#991b1b; font-family:'Consolas',monospace;
      margin-top:8px; white-space:pre-wrap; word-break:break-all; display:none;
    }
    .err-pos { font-size:.76rem; color:#b91c1c; margin-top:4px; }
    .copy-msg { color:var(--emerald); font-size:.78rem; margin-top:6px; display:none; }
    .validate-ok-box {
      background:#d1fae5; border:1px solid #a7f3d0; border-radius:9px;
      padding:10px 14px; font-size:.82rem; color:#065f46; font-weight:700;
      margin-top:8px; display:none;
    }
    .action-btns { display:flex; gap:8px; flex-wrap:wrap; margin:12px 0; }
    .col-label { font-size:.78rem; font-weight:700; color:var(--text2); margin-bottom:6px; }
  </style>
</head>
<body>
<header>
  <div class="hdr">
    <a class="hdr-back" href="../">&#8592; ツール一覧に戻る</a>
    <div class="hdr-title">&#128196; JSONフォーマッター</div>
    <div class="hdr-sub">JSONの整形・圧縮・バリデーション。構文エラーの詳細表示付き</div>
  </div>
</header>

<main>
  <!-- Status bar -->
  <div class="status-bar status-idle" id="statusBar">
    <span id="statusText">JSONを入力してください</span>
    <span id="statusIcon"></span>
  </div>

  <!-- Action buttons -->
  <div class="card" style="padding:16px 20px;">
    <div class="card-title">操作</div>
    <div class="action-btns">
      <button class="btn btn-primary" onclick="format(2)">&#128260; 整形（2スペース）</button>
      <button class="btn btn-primary" onclick="format(4)">&#128260; 整形（4スペース）</button>
      <button class="btn btn-outline" onclick="minify()">&#9881; 圧縮（minify）</button>
      <button class="btn btn-outline" onclick="validateOnly()">&#10003; 検証のみ</button>
    </div>
    <div id="validateOkBox" class="validate-ok-box">JSON は有効です</div>
    <div id="errDetail" class="err-detail"></div>
  </div>

  <!-- Input / Output -->
  <div class="two-col">
    <div class="card">
      <div class="col-label">入力 JSON</div>
      <textarea
        class="input-area"
        id="inputArea"
        rows="10"
        placeholder='{"name": "太郎", "age": 30, "tags": ["dev", "tool"]}'
        oninput="onInputChange()"
        spellcheck="false"
      ></textarea>
      <div class="char-count" id="inputCount">0 文字</div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="clearInput()">&#10005; クリア</button>
        <button class="btn btn-outline" onclick="loadSample()">&#128196; サンプル</button>
      </div>
    </div>

    <div class="card">
      <div class="col-label">出力</div>
      <textarea
        class="output-area"
        id="outputArea"
        rows="10"
        readonly
        placeholder="ここに整形結果が表示されます"
        spellcheck="false"
      ></textarea>
      <div class="char-count" id="outputCount">0 文字</div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="copyOutput()">&#128203; コピー</button>
        <button class="btn btn-outline" onclick="clearOutput()">&#10005; クリア</button>
      </div>
      <div id="copyMsg" class="copy-msg">クリップボードにコピーしました</div>
    </div>
  </div>
</main>

<footer>
  <a href="../">ツール一覧</a> &nbsp;|&nbsp;
  <a href="https://toaruseigyoya.github.io/" target="_blank" rel="noopener">ホームページ</a>
  <div style="margin-top:6px;">データはブラウザ内でのみ処理されます。外部に送信されません。</div>
</footer>

<script>
  const SAMPLE_JSON = `{
  "project": "ツール集",
  "version": "1.0.0",
  "author": {
    "name": "開発者",
    "email": "example@example.com"
  },
  "features": ["整形", "圧縮", "バリデーション"],
  "active": true,
  "count": 42
}`;

  function setStatus(type, text) {
    const bar = document.getElementById('statusBar');
    const statusText = document.getElementById('statusText');
    bar.className = 'status-bar status-' + type;
    statusText.textContent = text;
  }

  function parseErrorInfo(e, input) {
    const msg = e.message || '';
    // Try to extract position from standard error messages
    // Chrome: "Unexpected token X in JSON at position N"
    // Firefox/others: "JSON.parse: unexpected character at line L column C ..."
    let detail = msg;
    let posHint = '';

    const posMatch = msg.match(/position (\d+)/i);
    if (posMatch) {
      const pos = parseInt(posMatch[1]);
      const before = input.substring(0, pos);
      const lineNum = (before.match(/\n/g) || []).length + 1;
      const colNum = pos - before.lastIndexOf('\n');
      posHint = '行 ' + lineNum + '、列 ' + colNum + ' 付近 (文字位置: ' + pos + ')';
      // Show snippet
      const snippet = input.substring(Math.max(0, pos - 20), pos + 20)
        .replace(/\n/g, '\\n');
      detail += '\n\n前後: ...' + snippet + '...';
    }
    const lineMatch = msg.match(/line (\d+) column (\d+)/i);
    if (lineMatch && !posMatch) {
      posHint = '行 ' + lineMatch[1] + '、列 ' + lineMatch[2] + ' 付近';
    }

    return { detail, posHint };
  }

  function showError(e, input) {
    const { detail, posHint } = parseErrorInfo(e, input);
    setStatus('err', 'JSON エラー');

    const errBox = document.getElementById('errDetail');
    errBox.style.display = '';
    errBox.textContent = detail + (posHint ? '\n\n場所: ' + posHint : '');

    document.getElementById('validateOkBox').style.display = 'none';
  }

  function clearError() {
    document.getElementById('errDetail').style.display = 'none';
    document.getElementById('validateOkBox').style.display = 'none';
  }

  function tryParse(input) {
    const trimmed = input.trim();
    if (!trimmed) {
      setStatus('idle', 'JSONを入力してください');
      clearError();
      return null;
    }
    try {
      return JSON.parse(trimmed);
    } catch (e) {
      showError(e, trimmed);
      document.getElementById('outputArea').value = '';
      updateOutputCount();
      return null;
    }
  }

  function format(spaces) {
    clearError();
    const input = document.getElementById('inputArea').value;
    const parsed = tryParse(input);
    if (parsed === null && input.trim()) return;
    if (parsed === null) return;
    const result = JSON.stringify(parsed, null, spaces);
    document.getElementById('outputArea').value = result;
    updateOutputCount();
    setStatus('ok', '整形完了 (' + spaces + 'スペース)');
  }

  function minify() {
    clearError();
    const input = document.getElementById('inputArea').value;
    const parsed = tryParse(input);
    if (parsed === null && input.trim()) return;
    if (parsed === null) return;
    const result = JSON.stringify(parsed);
    document.getElementById('outputArea').value = result;
    updateOutputCount();
    setStatus('ok', '圧縮完了');
  }

  function validateOnly() {
    clearError();
    const input = document.getElementById('inputArea').value;
    const trimmed = input.trim();
    if (!trimmed) {
      setStatus('idle', 'JSONを入力してください');
      return;
    }
    try {
      JSON.parse(trimmed);
      setStatus('ok', 'JSON は有効です');
      document.getElementById('validateOkBox').style.display = '';
    } catch (e) {
      showError(e, trimmed);
    }
  }

  function onInputChange() {
    const val = document.getElementById('inputArea').value;
    document.getElementById('inputCount').textContent = val.length.toLocaleString() + ' 文字';
    // Auto-clear error when user edits
    clearError();
    if (!val.trim()) {
      setStatus('idle', 'JSONを入力してください');
    } else {
      setStatus('idle', '操作ボタンを押してください');
    }
  }

  function updateOutputCount() {
    const val = document.getElementById('outputArea').value;
    document.getElementById('outputCount').textContent = val.length.toLocaleString() + ' 文字';
  }

  function clearInput() {
    document.getElementById('inputArea').value = '';
    document.getElementById('inputCount').textContent = '0 文字';
    clearError();
    setStatus('idle', 'JSONを入力してください');
  }

  function clearOutput() {
    document.getElementById('outputArea').value = '';
    document.getElementById('outputCount').textContent = '0 文字';
    document.getElementById('copyMsg').style.display = 'none';
  }

  function loadSample() {
    document.getElementById('inputArea').value = SAMPLE_JSON;
    onInputChange();
  }

  function copyOutput() {
    const val = document.getElementById('outputArea').value;
    if (!val.trim()) return;
    navigator.clipboard.writeText(val).then(() => {
      const msg = document.getElementById('copyMsg');
      msg.style.display = '';
      setTimeout(() => { msg.style.display = 'none'; }, 2000);
    });
  }
</script>
</body>
</html>
