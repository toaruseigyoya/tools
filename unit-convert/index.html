<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>単位変換 | ツール集</title>
  <style>
    :root {
      --indigo: #4f46e5;
      --violet: #7c3aed;
      --emerald: #059669;
      --bg: #f5f6ff;
      --surf: #fff;
      --border: #e0e7ff;
      --text: #1e1b4b;
      --text2: #4c4980;
      --muted: #8b87c0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: linear-gradient(135deg, #1e1b4b, #312e81);
      color: #fff;
      padding: 24px 20px;
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      opacity: 0.9;
      transition: opacity 0.2s;
    }

    header a:hover {
      opacity: 1;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 20px 40px;
    }

    .card {
      background: var(--surf);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.06);
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .tab {
      padding: 12px 16px;
      border: none;
      background: none;
      color: var(--text2);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab.active {
      color: var(--indigo);
      border-bottom-color: var(--indigo);
    }

    .tab:hover {
      color: var(--text);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .input-group {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      margin-bottom: 20px;
    }

    input[type="number"] {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
    }

    input[type="number"]:focus {
      outline: none;
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--surf);
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    .results {
      display: grid;
      gap: 12px;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .result-label {
      font-size: 13px;
      color: var(--text2);
      font-weight: 500;
    }

    .result-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--indigo);
      font-family: 'Monaco', 'Menlo', monospace;
    }

    footer {
      text-align: center;
      padding: 24px 20px;
      border-top: 1px solid var(--border);
      margin-top: 40px;
      font-size: 12px;
      color: var(--text2);
    }

    footer a {
      color: var(--indigo);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    .footer-links {
      margin-top: 12px;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    @media (max-width: 860px) {
      header h1 {
        font-size: 24px;
      }

      main {
        padding: 0 16px 32px;
      }

      .card {
        padding: 16px;
      }

      .input-group {
        grid-template-columns: 1fr;
      }

      .tabs {
        gap: 4px;
      }

      .tab {
        padding: 10px 12px;
        font-size: 13px;
      }
    }
      .tool-guide { background:var(--surf,#fff); border:1px solid var(--border,#e0e7ff); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 2px 10px rgba(79,70,229,.06); }
    .tool-guide h2 { font-size:.95rem; color:#3730a3; margin:0 0 10px; }
    .tool-guide-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; }
    .tool-guide-item { background:var(--bg,#f5f6ff); border:1px solid var(--border,#e0e7ff); border-radius:10px; padding:10px; font-size:.8rem; line-height:1.55; color:var(--text2,#4c4980); }
    .tool-guide-item strong { display:block; color:var(--text,#1e1b4b); font-size:.76rem; margin-bottom:3px; }
    .tool-guide-links { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
    .tool-guide-links a { color:#4f46e5; background:#eef2ff; border:1px solid #e0e7ff; border-radius:999px; padding:5px 10px; font-size:.76rem; font-weight:800; text-decoration:none; }
  </style>
</head>
<body>
  <header>
    <h1>単位変換</h1>
    <a href="../">← ツール一覧へ戻る</a>
  </header>

  <main>
  <section class="tool-guide" aria-label="このツールの説明">
    <h2>このツールでできること</h2>
    <div class="tool-guide-grid">
      <div class="tool-guide-item"><strong>用途</strong>単位変換 をブラウザで処理する無料ツールです。</div>
      <div class="tool-guide-item"><strong>向いている人</strong>数値や日付をすぐ確認したい人</div>
      <div class="tool-guide-item"><strong>入力例</strong>1000円、2026-05-04、m/kmなど</div>
      <div class="tool-guide-item"><strong>出力例</strong>計算結果、換算値、日数</div>
      <div class="tool-guide-item"><strong>使い方</strong>入力する → 実行する → 結果をコピーまたは保存します。</div>
      <div class="tool-guide-item"><strong>注意点</strong>入力内容はブラウザ内で処理します。専門用語や形式が必要な場合は入力例を参考にしてください。</div>
    </div>
    <div class="tool-guide-links"><a href="../date-diff/">date-diff</a><a href="../unit-convert/">unit-convert</a><a href="../tax-calc/">tax-calc</a></div>
  </section>
    <div class="card">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('length')">長さ</button>
        <button class="tab" onclick="switchTab('weight')">重量</button>
        <button class="tab" onclick="switchTab('temperature')">温度</button>
        <button class="tab" onclick="switchTab('area')">面積</button>
        <button class="tab" onclick="switchTab('speed')">速度</button>
      </div>

      <!-- 長さ -->
      <div id="length" class="tab-content active">
        <div class="card-title">長さの変換</div>
        <div class="input-group">
          <input type="number" id="lengthValue" value="1" placeholder="値を入力" oninput="convertLength()">
          <select id="lengthUnit" onchange="convertLength()">
            <option value="mm">mm</option>
            <option value="cm" selected>cm</option>
            <option value="m">m</option>
            <option value="km">km</option>
            <option value="in">インチ</option>
            <option value="ft">フィート</option>
            <option value="mi">マイル</option>
          </select>
        </div>
        <div class="results" id="lengthResults"></div>
      </div>

      <!-- 重量 -->
      <div id="weight" class="tab-content">
        <div class="card-title">重量の変換</div>
        <div class="input-group">
          <input type="number" id="weightValue" value="1" placeholder="値を入力" oninput="convertWeight()">
          <select id="weightUnit" onchange="convertWeight()">
            <option value="mg">mg</option>
            <option value="g" selected>g</option>
            <option value="kg">kg</option>
            <option value="t">t</option>
            <option value="oz">オンス</option>
            <option value="lb">ポンド</option>
          </select>
        </div>
        <div class="results" id="weightResults"></div>
      </div>

      <!-- 温度 -->
      <div id="temperature" class="tab-content">
        <div class="card-title">温度の変換</div>
        <div class="input-group">
          <input type="number" id="tempValue" value="20" placeholder="値を入力" oninput="convertTemperature()">
          <select id="tempUnit" onchange="convertTemperature()">
            <option value="c" selected>℃</option>
            <option value="f">℉</option>
            <option value="k">K</option>
          </select>
        </div>
        <div class="results" id="tempResults"></div>
      </div>

      <!-- 面積 -->
      <div id="area" class="tab-content">
        <div class="card-title">面積の変換</div>
        <div class="input-group">
          <input type="number" id="areaValue" value="1" placeholder="値を入力" oninput="convertArea()">
          <select id="areaUnit" onchange="convertArea()">
            <option value="mm2">mm²</option>
            <option value="cm2">cm²</option>
            <option value="m2" selected>m²</option>
            <option value="km2">km²</option>
            <option value="ha">ha</option>
            <option value="a">アール</option>
          </select>
        </div>
        <div class="results" id="areaResults"></div>
      </div>

      <!-- 速度 -->
      <div id="speed" class="tab-content">
        <div class="card-title">速度の変換</div>
        <div class="input-group">
          <input type="number" id="speedValue" value="1" placeholder="値を入力" oninput="convertSpeed()">
          <select id="speedUnit" onchange="convertSpeed()">
            <option value="ms" selected>m/s</option>
            <option value="kmh">km/h</option>
            <option value="mph">mph</option>
            <option value="knot">knot</option>
          </select>
        </div>
        <div class="results" id="speedResults"></div>
      </div>
    </div>
  </main>

  <footer>
    © 2026 とある制御屋のツール集
    <div class="footer-links">
      <a href="../">ツール一覧へ戻る</a>
      <a href="https://toaruseigyoya.github.io/">公式サイト</a>
    </div>
  </footer>

  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    function formatNumber(num) {
      return num.toLocaleString('ja-JP', { minimumFractionDigits: 0, maximumFractionDigits: 10 });
    }

    function convertLength() {
      const value = parseFloat(document.getElementById('lengthValue').value) || 0;
      const unit = document.getElementById('lengthUnit').value;

      const toMm = {
        'mm': 1,
        'cm': 10,
        'm': 1000,
        'km': 1000000,
        'in': 25.4,
        'ft': 304.8,
        'mi': 1609344
      };

      const baseMm = value * toMm[unit];
      const results = {
        'mm': baseMm / 1,
        'cm': baseMm / 10,
        'm': baseMm / 1000,
        'km': baseMm / 1000000,
        'in': baseMm / 25.4,
        'ft': baseMm / 304.8,
        'mi': baseMm / 1609344
      };

      displayResults('lengthResults', { 'mm': 'mm', 'cm': 'cm', 'm': 'm', 'km': 'km', 'in': 'インチ', 'ft': 'フィート', 'mi': 'マイル' }, results);
    }

    function convertWeight() {
      const value = parseFloat(document.getElementById('weightValue').value) || 0;
      const unit = document.getElementById('weightUnit').value;

      const toMg = {
        'mg': 1,
        'g': 1000,
        'kg': 1000000,
        't': 1000000000,
        'oz': 28349.5,
        'lb': 453592
      };

      const baseMg = value * toMg[unit];
      const results = {
        'mg': baseMg / 1,
        'g': baseMg / 1000,
        'kg': baseMg / 1000000,
        't': baseMg / 1000000000,
        'oz': baseMg / 28349.5,
        'lb': baseMg / 453592
      };

      displayResults('weightResults', { 'mg': 'mg', 'g': 'g', 'kg': 'kg', 't': 't', 'oz': 'オンス', 'lb': 'ポンド' }, results);
    }

    function convertTemperature() {
      const value = parseFloat(document.getElementById('tempValue').value) || 0;
      const unit = document.getElementById('tempUnit').value;

      let c, f, k;

      if (unit === 'c') {
        c = value;
        f = c * 9 / 5 + 32;
        k = c + 273.15;
      } else if (unit === 'f') {
        f = value;
        c = (f - 32) * 5 / 9;
        k = c + 273.15;
      } else {
        k = value;
        c = k - 273.15;
        f = c * 9 / 5 + 32;
      }

      displayResults('tempResults', { 'c': '℃', 'f': '℉', 'k': 'K' }, { 'c': c, 'f': f, 'k': k });
    }

    function convertArea() {
      const value = parseFloat(document.getElementById('areaValue').value) || 0;
      const unit = document.getElementById('areaUnit').value;

      const toMm2 = {
        'mm2': 1,
        'cm2': 100,
        'm2': 1000000,
        'km2': 1000000000000,
        'ha': 10000000000,
        'a': 1000000
      };

      const baseMm2 = value * toMm2[unit];
      const results = {
        'mm2': baseMm2 / 1,
        'cm2': baseMm2 / 100,
        'm2': baseMm2 / 1000000,
        'km2': baseMm2 / 1000000000000,
        'ha': baseMm2 / 10000000000,
        'a': baseMm2 / 1000000
      };

      displayResults('areaResults', { 'mm2': 'mm²', 'cm2': 'cm²', 'm2': 'm²', 'km2': 'km²', 'ha': 'ha', 'a': 'アール' }, results);
    }

    function convertSpeed() {
      const value = parseFloat(document.getElementById('speedValue').value) || 0;
      const unit = document.getElementById('speedUnit').value;

      const toMs = {
        'ms': 1,
        'kmh': 1 / 3.6,
        'mph': 0.44704,
        'knot': 0.51444
      };

      const baseMs = value * toMs[unit];
      const results = {
        'ms': baseMs / 1,
        'kmh': baseMs * 3.6,
        'mph': baseMs / 0.44704,
        'knot': baseMs / 0.51444
      };

      displayResults('speedResults', { 'ms': 'm/s', 'kmh': 'km/h', 'mph': 'mph', 'knot': 'knot' }, results);
    }

    function displayResults(elementId, labels, values) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';

      Object.keys(labels).forEach(key => {
        const div = document.createElement('div');
        div.className = 'result-item';
        const val = values[key].toFixed(10).replace(/\.?0+$/, '');
        div.innerHTML = `<span class="result-label">${labels[key]}</span><span class="result-value">${val}</span>`;
        container.appendChild(div);
      });
    }

    convertLength();
  </script>
</body>
</html>
