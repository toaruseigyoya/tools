    input:focus, select:focus { outline:none; border-color:#818cf8; box-shadow:0 0 0 3px rgba(79,70,229,.1); }
    .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:12px; }
    .stat { background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px; text-align:center; }
    .stat strong { display:block; color:var(--indigo); font-size:1.25rem; font-family:Consolas,monospace; }
    .stat span { color:var(--muted); font-size:.72rem; }

    .item { background:rgba(255,255,255,.78); border:1px solid var(--border); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; min-height:150px; }

    .desc { color:var(--text2); font-size:.84rem; line-height:1.55; flex:1; }

    .empty { display:none; text-align:center; color:var(--muted); padding:40px 0; }
    footer { text-align:center; padding:20px; font-size:.73rem; color:var(--muted); border-top:1px solid var(--border); margin-top:8px; }

  const grid = document.getElementById('grid'), empty = document.getElementById('empty'), shownCount = document.getElementById('shownCount'), search = document.getElementById('search'), category = document.getElementById('category');

  function render(){ const q = search.value.trim().toLowerCase(), cat = category.value; const rows = ideas.filter(function(item){ const text = (item.title + ' ' + item.desc + ' ' + item.category).toLowerCase(); return (!q || text.includes(q)) && (!cat || item.category === cat); }); shownCount.textContent = rows.length.toLocaleString('ja-JP'); empty.style.display = rows.length ? 'none' : 'block'; grid.innerHTML = rows.map(function(item){ return '<article class="item"><div class="item-head"><div class="title">' + esc(item.title) + '</div><div class="no">No.' + esc(item.no) + '</div></div><p class="desc">' + esc(item.desc) + '</p><div class="chips"><span class="chip cat">' + esc(item.category) + '</span><span class="chip idea">未実装案</span></div></article>'; }).join(''); }
