<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>メールアドレス抽出 | 公開ツール一覧</title><style>
body{font-family:'Segoe UI','Yu Gothic UI',sans-serif;background:#f6f8fc;color:#1f2937;margin:0}header,main{max-width:900px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #d9e3f0;border-radius:14px;padding:18px;margin:14px 0}textarea{width:100%;min-height:220px;border:1px solid #d9e3f0;border-radius:12px;padding:12px;font:15px/1.7 Consolas,monospace}.out{white-space:pre-wrap;word-break:break-all;background:#f8fbff;border:1px solid #d9e3f0;border-radius:12px;padding:12px;min-height:140px}.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:900;background:#3b82f6;color:#fff;margin-top:8px}.back{color:#2563eb;text-decoration:none;font-weight:800}.muted{color:#667085}</style></head><body><header><a class="back" href="../">← 公開ツール一覧へ</a><h1>メールアドレス抽出</h1><p class="muted">文章からメールアドレスだけを抽出します。入力内容はブラウザ内で処理します。</p></header><main><section class="card"><textarea id="input" placeholder="メールアドレスを含む文章を貼り付けてください"></textarea><button class="btn" id="copy">結果をコピー</button></section><section class="card"><h2>抽出結果</h2><div class="out" id="out"></div></section></main><script>
const input=document.getElementById('input'),out=document.getElementById('out');function run(){const re=/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi;const arr=[...new Set(input.value.match(re)||[])];out.textContent=arr.join('\n')||'メールアドレスは見つかりませんでした。'}input.addEventListener('input',run);document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(out.textContent);run();
</script></body></html>
